[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/proto",
    "crates/web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["vladgon <vladgon@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/vladgon/rust-devin"

[workspace.dependencies]
# Error handling
anyhow = "*"
thiserror = "*"

# Serialization
serde = { version = "*", features = ["derive"] }
serde_json = "*"

# Async runtime
tokio = { version = "*", features = ["full"] }

# Web (Axum stack)
axum = "*"
tower = "*"
tower-http = { version = "*", features = ["trace", "cors"] }

# gRPC (Tonic stack)
tonic = "*"
tonic-prost = "*"
tonic-prost-build = "*"
prost = "*"
prost-build = "*"
prost-types = "*"

# tonic-rest: REST + SSE transcoding from google.api.http annotations
tonic-rest = "*"
tonic-rest-build = "*"

# Build-script glob helper — lets proto/build.rs discover `.proto` files
# instead of listing them one by one.
glob = "*"

# HTTP + async primitives used by tonic-rest-generated handlers
futures = "*"

# Logging / tracing
tracing = "*"
tracing-subscriber = { version = "*", features = ["env-filter"] }

# Internal workspace crates
common = { path = "crates/common" }
proto = { path = "crates/proto" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
