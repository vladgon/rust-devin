syntax = "proto3";

package greeter;

import "google/api/annotations.proto";

// A minimal example service exercising tonic-grpc and tonic-rest transcoding.
service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply) {
    option (google.api.http) = {
      post: "/v1/greeter/sayHello"
      body: "*"
    };
  }
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
