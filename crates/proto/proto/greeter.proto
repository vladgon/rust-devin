syntax = "proto3";

package greeter;

import "google/api/annotations.proto";
import "validate/validate.proto";

// A minimal example service exercising tonic-grpc and tonic-rest transcoding.
service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply) {
    option (google.api.http) = {
      post: "/v1/greeter/sayHello"
      body: "*"
    };
  }
}

message HelloRequest {
  // Caller name — mandatory (protoc-gen-validate enforces non-empty strings
  // via `min_len: 1`, there is no separate `required` option for scalars).
  string name = 1 [(validate.rules).string.min_len = 1];
}

message HelloReply {
  string message = 1;
}
